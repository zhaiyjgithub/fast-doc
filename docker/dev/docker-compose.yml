services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fastdoc_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: emr123
      POSTGRES_DB: emr_dev
    ports:
      - "5432:5432"
    volumes:
      - fastdoc_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d emr_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fastdoc_dev_postgres_data:
